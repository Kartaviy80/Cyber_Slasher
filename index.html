<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Slasher - Tap & Timing</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #020617;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        .hud {
            position: absolute;
            top: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .icon {
            font-size: 32px;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.8));
        }
        .score {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px #a855f7, 0 0 40px #a855f7;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .game-container {
            position: relative;
            width: 90vw;
            max-width: 380px;
            height: 80vh;
            max-height: 580px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <div class="hud">
        <span class="icon">⚔️</span>
        <div class="score" id="score">0</div>
    </div>

    <div class="game-container" id="container">
        <canvas id="gameCanvas" width="600" height="900"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const container = document.getElementById('container');

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;

        // Линейное лезвие (сканер)
        let bladeY = 0;
        let bladeSpeed = 8;
        let bladeDirection = 1;

        // Кристалл-цель
        let target = { x: 300, y: 300, width: 140, height: 60 };
        const colors = ['#a855f7', '#06b6d4', '#f43f5e', '#10b981', '#f59e0b', '#3b82f6'];
        let colorIndex = 0;

        let particles = [];
        let shakeTime = 0;

        // --- Звуковой движок (Web Audio API) ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Звук разреза
        function playSlashSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800 + score * 30, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playFailSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(160, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        }

        // Эффект взрыва кристаллов на прямоугольные осколки
        function createShatter(x, y, color) {
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * target.width,
                    y: y + (Math.random() - 0.5) * target.height,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16,
                    sizeW: Math.random() * 12 + 4,
                    sizeH: Math.random() * 8 + 3,
                    color: color,
                    alpha: 1,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.2
                });
            }
        }

        function triggerScreenShake() {
            shakeTime = 10;
        }

        function spawnTarget() {
            const margin = 120;
            target.y = margin + Math.random() * (canvas.height - margin * 2 - target.height);
            target.height = Math.max(35, 75 - score * 1.2);
            colorIndex = (colorIndex + 1) % colors.length;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Обработка тряски экрана при попадании
            if (shakeTime > 0) {
                ctx.save();
                ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
                shakeTime--;
            }

            // 1. Сетка фона
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            const currentColor = colors[colorIndex];

            // 2. Целевой блок (Кристалл)
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - target.width / 2, target.y - target.height / 2, target.width, target.height, 12);
            ctx.fillStyle = currentColor;
            ctx.shadowColor = currentColor;
            ctx.shadowBlur = 30;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Внутренний блик кристалла
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - target.width / 2 + 8, target.y - target.height / 2 + 6, target.width - 16, target.height / 3, 6);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();

            // 3. Сканирующее лезвие (Лазер)
            ctx.beginPath();
            ctx.moveTo(0, bladeY);
            ctx.lineTo(canvas.width, bladeY);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 4. Осколки кристалла
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.vRot;
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    particles.splice(idx, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.sizeW / 2, -p.sizeH / 2, p.sizeW, p.sizeH);
                    ctx.restore();
                }
            });

            // 5. Иконка запуска (Без слов)
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
                ctx.fillStyle = '#a855f7';
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 35;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.moveTo(canvas.width / 2 - 12, canvas.height / 2 - 22);
                ctx.lineTo(canvas.width / 2 + 22, canvas.height / 2);
                ctx.lineTo(canvas.width / 2 - 12, canvas.height / 2 + 22);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            if (shakeTime >= 0 && gameState === 'PLAYING') {
                ctx.restore();
            }
        }

        function update() {
            if (gameState === 'PLAYING') {
                bladeY += bladeSpeed * bladeDirection;

                if (bladeY >= canvas.height - 20 || bladeY <= 20) {
                    bladeDirection *= -1;
                }
            }
            draw();
            requestAnimationFrame(update);
        }

        function handleTap() {
            initAudio();

            if (gameState === 'START' || gameState === 'GAMEOVER') {
                score = 0;
                scoreEl.innerText = score;
                bladeY = 50;
                bladeSpeed = 9;
                bladeDirection = 1;
                particles = [];
                spawnTarget();
                gameState = 'PLAYING';
            } else if (gameState === 'PLAYING') {
                const targetTop = target.y - target.height / 2;
                const targetBottom = target.y + target.height / 2;

                if (bladeY >= targetTop && bladeY <= targetBottom) {
                    // Разрез успешен!
                    score++;
                    scoreEl.innerText = score;
                    playSlashSound();
                    triggerScreenShake();

                    createShatter(canvas.width / 2, target.y, colors[colorIndex]);

                    scoreEl.style.transform = 'scale(1.3)';
                    setTimeout(() => scoreEl.style.transform = 'scale(1)', 100);

                    bladeDirection *= -1;
                    bladeSpeed = Math.min(22, bladeSpeed + 0.6);
                    spawnTarget();
                } else {
                    // Промах!
                    playFailSound();
                    gameState = 'GAMEOVER';
                }
            }
        }

        window.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleTap();
        });

        update();
    </script>
</body>
</html>
